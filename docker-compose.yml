version: "3.8"

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: edgeflow-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - simulation
      - vision
      - hardware
      - experiment
      - dev

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: edgeflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - EDGEFLOW_ENV=${EDGEFLOW_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - EDGEFLOW_TOPOLOGY=${EDGEFLOW_TOPOLOGY:-four_intersection_v1}
      - EDGEFLOW_CONTROLLER=${EDGEFLOW_CONTROLLER:-max_pressure}
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts
      - ./src:/app/src
      - ./output:/app/output
      - ./artifacts:/app/artifacts
      - ./services/api/main.py:/app/main.py
    profiles:
      - simulation
      - vision
      - hardware
      - dev

  graph-control:
    build:
      context: .
      dockerfile: services/graph-control/Dockerfile
    container_name: edgeflow-graph-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EDGEFLOW_ENV=${EDGEFLOW_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - EDGEFLOW_TOPOLOGY=${EDGEFLOW_TOPOLOGY:-four_intersection_v1}
      - EDGEFLOW_CONTROLLER=${EDGEFLOW_CONTROLLER:-max_pressure}
      - RL_MODEL_PATH=${RL_MODEL_PATH:-}
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts
      - ./src:/app/src
      - ./models:/models:ro
    profiles:
      - simulation
      - vision
      - hardware
      - dev

  simulator:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    container_name: edgeflow-simulator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EDGEFLOW_ENV=${EDGEFLOW_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - EDGEFLOW_TOPOLOGY=${EDGEFLOW_TOPOLOGY:-four_intersection_v1}
      - USE_SUMO=${USE_SUMO:-false}
      - SIM_INTERVAL_S=${SIM_INTERVAL_S:-1.0}
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts
      - ./services/simulator/sumo_configs:/app/sumo_configs
    profiles:
      - manual-sim

  vision:
    build:
      context: ./services/vision
      dockerfile: Dockerfile
    container_name: edgeflow-vision
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EDGEFLOW_ENV=${EDGEFLOW_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts
    profiles:
      - vision
      - dev

  actuator:
    build:
      context: .
      dockerfile: services/actuator/Dockerfile
    container_name: edgeflow-actuator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EDGEFLOW_ENV=${EDGEFLOW_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts
      - ./src:/app/src
    profiles:
      - simulation
      - vision
      - hardware
      - dev

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: edgeflow-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./services/dashboard/src:/app/src
    profiles:
      - simulation
      - vision
      - hardware
      - dev

  experiment-runner:
    build:
      context: .
      dockerfile: services/experiment-runner/Dockerfile
    container_name: edgeflow-experiment-runner
    env_file:
      - .env
    environment:
      - EDGEFLOW_ENV=${EDGEFLOW_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MQTT_HOST=${MQTT_HOST:-mqtt}
      - MQTT_PORT=${MQTT_PORT:-1883}
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts
      - ./artifacts:/app/artifacts
    profiles:
      - experiment
      - dev

