; EdgeFlow AI - PlatformIO build for the ESP32 signal actuator.
;   All nodes J1..J5: ESP32-DevKitC-32U (external IPEX antenna) on a 38-pin breakout base
;   (the semifinal NodeMCU-32S + breadboard boards are retired). Same pin map as before
;   (see schematic_and_pinout.md); DevKitC has no user LED on GPIO 2.
;
; Build + flash one node (run from src/hardware/):
;   pio run -e J1 -t upload        ; board for intersection J1 (J2..J5 likewise)
;   pio device monitor -e J1       ; serial log + TRACE lines (115200 baud)
;
; Network settings: copy secrets.example.ini to secrets.ini (git-ignored) and edit
; WIFI_SSID / WIFI_PASS / MQTT_BROKER there (set_network.sh writes it; optional
; WIFI_SSID_2/_3 fallback networks). Without secrets.ini the build stops with #error:
; credentials are never compiled in from the source.
; Optional flags: -D OUTPUT_READBACK=0 (no output readback), -D WIFI_TX_POWER=WIFI_POWER_11dBm.

[platformio]
src_dir = firmware
extra_configs = secrets.ini

[secrets]
; Overridden by secrets.ini when present.
build_flags =

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    ${secrets.build_flags}
    ; Every safe-stop button is wired on its normally-closed contact: open (HIGH) = pressed
    -D SAFE_STOP_PRESSED_LEVEL=HIGH

[env:J1]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J1\"

[env:J2]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J2\"

; --- 5-node sa ban (1800 x 1200): J1 J2 J3 rear row, J4 J5 front row -------------

[env:J3]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J3\"

[env:J4]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J4\"

[env:J5]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J5\"
