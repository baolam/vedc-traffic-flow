; EdgeFlow AI - PlatformIO build for the ESP32 signal actuator (NodeMCU-32S, CH340).
;
; Build + flash one node (run from src/hardware/):
;   pio run -e J1 -t upload        ; board for intersection J1
;   pio run -e J2 -t upload        ; board for intersection J2
;   pio device monitor -e J1       ; serial log + TRACE lines (115200 baud)
;
; Network settings: copy secrets.example.ini to secrets.ini (git-ignored) and edit
; WIFI_SSID / WIFI_PASS / MQTT_BROKER there. Without secrets.ini the firmware
; defaults in esp32_signal_controller.ino are used.

[platformio]
src_dir = firmware
extra_configs = secrets.ini

[secrets]
; Overridden by secrets.ini when present.
build_flags =

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    ${secrets.build_flags}
    ; Both safe-stop buttons are wired on their normally-closed contact: open (HIGH) = pressed
    -D SAFE_STOP_PRESSED_LEVEL=HIGH

[env:J1]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J1\"
    ; J1's safe-stop button is soldered to GPIO 16 instead of GPIO 4
    -D SAFE_STOP_GPIO=16

[env:J2]
build_flags =
    ${env.build_flags}
    -D NODE_ID=\"J2\"
