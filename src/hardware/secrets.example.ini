; Copy to secrets.ini (git-ignored) and edit for the demo network.
; MQTT_BROKER = the machine running Mosquitto (laptop in 3-tier mode, or the Pi
; in standalone mode). Give it a DHCP reservation on the router.
[secrets]
build_flags =
    -D WIFI_SSID=\"EdgeFlow_Local_AP\"
    -D WIFI_PASS=\"EdgeFlow2026\"
    -D MQTT_BROKER=\"192.168.1.100\"
