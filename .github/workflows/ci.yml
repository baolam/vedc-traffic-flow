name: EdgeFlow AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Contract & Unit Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic pydantic-settings pyyaml jsonschema networkx paho-mqtt fastapi uvicorn websockets requests scikit-learn numpy

    - name: Run Schema Contract Tests
      run: |
        python -m pytest tests/unit/test_contracts.py

    - name: Run Unit Tests
      run: |
        python -m pytest tests/unit

    - name: Run Integration Tests
      run: |
        python -m pytest tests/integration
